[workspace]
resolver = "2"
members = [
    "contracts/verifier",
    "contracts/strategy-trait",
    "contracts/strategy-a",
    "contracts/strategy-b",
    "contracts/audit-attestation",
    "contracts/vault",
]

[workspace.dependencies]
soroban-sdk = "28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
